name: Build iOS

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Remove Data.rsdk from bundle resources
        run: sed -i '' '/Data.rsdk in Resources/d' "RSDKv4 ios.xcodeproj/project.pbxproj"

      - name: Patch engine for iOS
        run: |
          python3 - <<'EOF'
          import re

          def load(p):
              raw = open(p, newline="").read()
              return raw, ("\r\n" if "\r\n" in raw else "\n"), raw.replace("\r\n", "\n")

          def save(p, s, nl):
              open(p, "w", newline="").write(s.replace("\n", nl))

          # 1. Platform detection + SDL2 for iOS
          p = "RSDKv4/RetroEngine.hpp"
          raw, nl, s = load(p)
          old = "#elif defined __APPLE__\n#if __IPHONEOS__"
          new = "#elif defined __APPLE__\n#include <TargetConditionals.h>\n#if TARGET_OS_IPHONE"
          assert old in s, "platform detection pattern not found"
          s = s.replace(old, new, 1)
          s, n = re.subn(
              r"(\|\| RETRO_PLATFORM == RETRO_ANDROID)(\s*\n#ifdef RETRO_USE_SDL2)",
              r"\1 || RETRO_PLATFORM == RETRO_iOS\2", s, count=1)
          assert n == 1, "SDL2 platform list pattern not found"
          save(p, s, nl)

          # 2. Run from the app's Documents folder
          p = "RSDKv4/main.cpp"
          raw, nl, s = load(p)
          old = "int main(int argc, char *argv[])\n{\n"
          assert old in s, "main() pattern not found"
          block = (
              "#if RETRO_PLATFORM == RETRO_iOS\n"
              "    {\n"
              "        const char *home = getenv(\"HOME\");\n"
              "        if (home) {\n"
              "            char docs[1024];\n"
              "            snprintf(docs, sizeof(docs), \"%s/Documents\", home);\n"
              "            chdir(docs);\n"
              "        }\n"
              "    }\n"
              "#endif\n"
          )
          s = s.replace(old, old + block, 1)
          s = "#include <unistd.h>\n#include <stdlib.h>\n#include <stdio.h>\n" + s
          save(p, s, nl)
          EOF

      - name: Build SDL2 for iOS
        run: |
          curl -fL -o sdl.tar.gz https://github.com/libsdl-org/SDL/archive/refs/tags/release-2.32.10.tar.gz
          tar xzf sdl.tar.gz
          SDLDIR=SDL-release-2.32.10
          xcodebuild \
            -project "$SDLDIR/Xcode/SDL/SDL.xcodeproj" \
            -target Framework-iOS \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/sdl-build" \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGNING_ALLOWED=NO \
            build
          cp -R sdl-build/Release-iphoneos/SDL2.framework dependencies/ios/
          ls dependencies/ios/SDL2.framework

          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=13.0 \
            -isysroot "$SDK" -I"$SDLDIR/include" \
            -c "$SDLDIR/src/main/uikit/SDL_uikit_main.c" -o sdlmain.o
          ar rcs dependencies/ios/libSDLMain.a sdlmain.o

      - name: Build libogg and libvorbis for iOS
        run: |
          PREFIX="$PWD/deps-ios"
          COMMON="-DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_INSTALL_PREFIX=$PREFIX"

          curl -fL -o ogg.tar.gz https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.gz
          tar xzf ogg.tar.gz
          cmake -S libogg-1.3.5 -B build-ogg $COMMON -DINSTALL_DOCS=OFF
          cmake --build build-ogg --target install

          curl -fL -o vorbis.tar.xz https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.xz
          tar xJf vorbis.tar.xz
          cmake -S libvorbis-1.3.7 -B build-vorbis $COMMON \
            -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DOGG_INCLUDE_DIR="$PREFIX/include" \
            -DOGG_LIBRARY="$PREFIX/lib/libogg.a"
          cmake --build build-vorbis --target install

          ls -la deps-ios/lib deps-ios/include

      - name: Generate Info.plist
        run: |
          cat > dependencies/ios/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleExecutable</key><string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key><string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>$(PRODUCT_NAME)</string>
            <key>CFBundleDisplayName</key><string>RSDKv4</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$(MARKETING_VERSION)</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>UIFileSharingEnabled</key><true/>
            <key>LSSupportsOpeningDocumentsInPlace</key><true/>
            <key>UIRequiresFullScreen</key><true/>
            <key>UIStatusBarHidden</key><true/>
            <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
          </dict>
          </plist>
          EOF
          plutil -insert UILaunchStoryboardName -string LaunchScreen dependencies/ios/Info.plist
          plutil -lint dependencies/ios/Info.plist

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project "RSDKv4 ios.xcodeproj" \
            -scheme "RSDKv4" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            GCC_PREPROCESSOR_DEFINITIONS='$(inherited) RETRO_USING_OPENGL=0' \
            HEADER_SEARCH_PATHS='$(inherited) $(PROJECT_DIR)/RSDKv4 $(PROJECT_DIR)/RSDKv4/NativeObjects $(PROJECT_DIR)/deps-ios/include $(PROJECT_DIR)/dependencies/all/asio/asio/include $(PROJECT_DIR)/dependencies/all/tinyxml2 $(PROJECT_DIR)/dependencies/all/stb-image' \
            LIBRARY_SEARCH_PATHS='$(inherited) $(PROJECT_DIR)/deps-ios/lib' \
            OTHER_LDFLAGS='$(inherited) -lvorbisfile -lvorbis -logg' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r RSDKv4-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv4-ios-unsigned
          path: RSDKv4-unsigned.ipa
