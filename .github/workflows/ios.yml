name: Build iOS

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Remove Data.rsdk from bundle resources
        run: sed -i '' '/Data.rsdk in Resources/d' "RSDKv4 ios.xcodeproj/project.pbxproj"

      - name: Drop Ogg/Vorbis framework links (we link static libs instead)
        run: |
          sed -i '' -e '/Ogg\.framework in /d' -e '/Vorbis\.framework in /d' -e '/vorbis\.framework in /d' \
            "RSDKv4 ios.xcodeproj/project.pbxproj"
          grep -n -i -E "ogg|vorbis" "RSDKv4 ios.xcodeproj/project.pbxproj" | head

      - name: Patch engine for iOS
        run: |
          python3 - <<'EOF'
          import re

          def load(p):
              raw = open(p, newline="").read()
              return raw, ("\r\n" if "\r\n" in raw else "\n"), raw.replace("\r\n", "\n")

          def save(p, s, nl):
              open(p, "w", newline="").write(s.replace("\n", nl))

          # 1. Platform detection + SDL2 for iOS
          p = "RSDKv4/RetroEngine.hpp"
          raw, nl, s = load(p)
          old = "#elif defined __APPLE__\n#if __IPHONEOS__"
          new = "#elif defined __APPLE__\n#include <TargetConditionals.h>\n#if TARGET_OS_IPHONE"
          assert old in s, "platform detection pattern not found"
          s = s.replace(old, new, 1)
          s, n = re.subn(
              r"(\|\| RETRO_PLATFORM == RETRO_ANDROID)(\s*\n#ifdef RETRO_USE_SDL2)",
              r"\1 || RETRO_PLATFORM == RETRO_iOS\2", s, count=1)
          assert n == 1, "SDL2 platform list pattern not found"
          save(p, s, nl)

          # 1b. getDocumentsPath for iOS
          raw, nl, s = load("RSDKv4/RetroEngine.hpp")
          old = "#elif RETRO_USING_SDL2\n#include <SDL2/SDL.h>\n#include <vorbis/vorbisfile.h>\n#else"
          new = '''#elif RETRO_USING_SDL2
          #include <SDL2/SDL.h>
          #include <vorbis/vorbisfile.h>
          #if RETRO_PLATFORM == RETRO_iOS
          #include <stdlib.h>
          #include <stdio.h>
          static inline const char *RSDK_GetDocumentsPath()
          {
              static char p[1024];
              if (!p[0]) {
                  const char *h = getenv("HOME");
                  snprintf(p, sizeof(p), "%s/Documents", h ? h : ".");
              }
              return p;
          }
          #define getDocumentsPath() RSDK_GetDocumentsPath()
          #endif
          #else'''.replace("\n          ", "\n")
          assert old in s, "SDL2 include branch not found"
          save("RSDKv4/RetroEngine.hpp", s.replace(old, new, 1), nl)

          # 1c. Use the OpenGL ES profile on iOS
          p = "RSDKv4/Drawing.cpp"
          raw, nl, s = load(p)
          s, n = re.subn(
              r"#if RETRO_PLATFORM != RETRO_ANDROID(\s*\n\s*SDL_GL_SetAttribute\(SDL_GL_CONTEXT_PROFILE_MASK, SDL_GL_CONTEXT_PROFILE_CORE\);)",
              r"#if RETRO_PLATFORM != RETRO_ANDROID && RETRO_PLATFORM != RETRO_iOS\1", s, count=1)
          assert n == 1, "GL profile pattern not found"
          save(p, s, nl)

          # 1d. Use SDL's own framebuffer as the "default" one on iOS
          p = "RSDKv4/Renderer.cpp"
          raw, nl, s = load(p)
          old = "glGetIntegerv(GL_FRAMEBUFFER_BINDING, &defaultFramebuffer);"
          assert old in s, "default framebuffer query not found"
          new = ("{\n"
                 "#if RETRO_PLATFORM == RETRO_iOS\n"
                 "            SDL_SysWMinfo wmInfo;\n"
                 "            SDL_VERSION(&wmInfo.version);\n"
                 "            if (SDL_GetWindowWMInfo(Engine.window, &wmInfo))\n"
                 "                defaultFramebuffer = (decltype(defaultFramebuffer))wmInfo.info.uikit.framebuffer;\n"
                 "            else\n"
                 "#endif\n"
                 "                glGetIntegerv(GL_FRAMEBUFFER_BINDING, &defaultFramebuffer);\n"
                 "            {\n"
                 "                GLint vp[4] = {0, 0, 0, 0};\n"
                 "                glGetIntegerv(GL_VIEWPORT, vp);\n"
                 "                int dw = 0, dh = 0;\n"
                 "                SDL_GL_GetDrawableSize(Engine.window, &dw, &dh);\n"
                 "                PrintLog(\"GLDEBUG: version=%s renderer=%s defaultFB=%d viewport=%d,%d,%d,%d drawable=%dx%d glErr=0x%x\",\n"
                 "                         (const char *)glGetString(GL_VERSION), (const char *)glGetString(GL_RENDERER),\n"
                 "                         (int)defaultFramebuffer, vp[0], vp[1], vp[2], vp[3], dw, dh, (unsigned)glGetError());\n"
                 "            }\n"
                 "        }")
          s = s.replace(old, new, 1)
          s = s.replace('#include "RetroEngine.hpp"', '#include "RetroEngine.hpp"\n#include <SDL2/SDL_syswm.h>', 1)

          # 1e. Debug logging for the GL path (logs the first few calls; remove once rendering works)
          def inject(s, pattern, label):
              rx = re.compile(r"(^void " + pattern + r"\s*\{)", re.M)
              code = ("\n    { static int dbg = 0; if (dbg < 4) { ++dbg; "
                      "PrintLog(\"GLDEBUG: " + label + " call %d glErr=0x%x\", dbg, (unsigned)glGetError()); } }")
              s2, n = rx.subn(lambda m: m.group(1) + code, s, count=1)
              print(label, "instrumented" if n else "NOT FOUND")
              return s2

          s = inject(s, r"RenderScene\(\)", "RenderScene")
          state_code = ("\n    { static int dbg2 = 0; if (dbg2 < 4) { ++dbg2; GLint vp[4] = {0, 0, 0, 0}; GLint fb = -1; "
                        "glGetIntegerv(GL_VIEWPORT, vp); glGetIntegerv(GL_FRAMEBUFFER_BINDING, &fb); int dw = 0, dh = 0; "
                        "SDL_GL_GetDrawableSize(Engine.window, &dw, &dh); "
                        "PrintLog(\"GLDEBUG: RenderScene state fb=%d status=0x%x viewport=%d,%d,%d,%d drawable=%dx%d ctx=%p\", "
                        "(int)fb, (unsigned)glCheckFramebufferStatus(GL_FRAMEBUFFER), vp[0], vp[1], vp[2], vp[3], dw, dh, "
                        "(void *)SDL_GL_GetCurrentContext()); } }")
          s, n = re.compile(r"(^void RenderScene\(\)\s*\{)", re.M).subn(lambda m: m.group(1) + state_code, s, count=1)
          print("RenderScene state logging", "added" if n else "NOT FOUND")
          s = inject(s, r"TransferRetroBuffer\(\)", "TransferRetroBuffer")
          s = inject(s, r"RenderRetroBuffer\([^)]*\)", "RenderRetroBuffer")
          s = inject(s, r"RenderImage\([^)]*\)", "RenderImage")
          save(p, s, nl)

          # 2. Run from the app's Documents folder
          p = "RSDKv4/main.cpp"
          raw, nl, s = load(p)
          old = "int main(int argc, char *argv[])\n{\n"
          assert old in s, "main() pattern not found"
          block = (
              "#if RETRO_PLATFORM == RETRO_iOS\n"
              "    {\n"
              "        const char *home = getenv(\"HOME\");\n"
              "        if (home) {\n"
              "            char docs[1024];\n"
              "            snprintf(docs, sizeof(docs), \"%s/Documents\", home);\n"
              "            chdir(docs);\n"
              "        }\n"
              "    }\n"
              "#endif\n"
          )
          s = s.replace(old, old + block, 1)
          s = "#include <unistd.h>\n#include <stdlib.h>\n#include <stdio.h>\n" + s
          save(p, s, nl)
          EOF

      - name: Repair stale source references
        run: |
          python3 - <<'EOF'
          import os, re

          p = "RSDKv4 ios.xcodeproj/project.pbxproj"
          text = open(p, encoding="utf-8").read()

          refs = {}
          for m in re.finditer(
              r'(\w{24}) /\* (.+?) \*/ = \{isa = PBXFileReference;[^\n]*?path = (?:"([^"]+)"|([^;]+));[^\n]*?sourceTree = ("[^"]*"|\w+);',
              text):
              refs[m.group(1)] = ((m.group(3) or m.group(4)).strip(), m.group(5))

          builds = {}
          for m in re.finditer(
              r'(\w{24}) /\* (.+?) in Sources \*/ = \{isa = PBXBuildFile; fileRef = (\w{24})', text):
              builds[m.group(1)] = m.group(3)

          remove, kept = set(), []
          for bid, rid in builds.items():
              path, tree = refs.get(rid, (None, None))
              if path and tree == "SOURCE_ROOT" and not os.path.exists(path):
                  print("removing stale source:", path)
                  remove.add(bid)
              elif path:
                  kept.append(path)

          lines = [l for l in text.split("\n") if not any(b in l for b in remove)]
          open(p, "w", encoding="utf-8").write("\n".join(lines))

          native_in_project = any("NativeObjects/" in k for k in kept)
          all_cpp = "RSDKv4/NativeObjects/All.cpp"
          print("NativeObjects already compiled by project:", native_in_project)
          if remove and os.path.exists(all_cpp) and not native_in_project:
              with open("RSDKv4/Text.cpp", "a") as f:
                  f.write('\n#include "NativeObjects/All.cpp"\n')
              print("appended NativeObjects/All.cpp include to Text.cpp")
          print("sources kept:", len(kept), "removed:", len(remove))
          EOF

      - name: Include source files missing from the project
        run: |
          python3 - <<'EOF'
          import os, re, glob

          p = "RSDKv4 ios.xcodeproj/project.pbxproj"
          text = open(p, encoding="utf-8").read()

          refs = {}
          for m in re.finditer(
              r'(\w{24}) /\* (.+?) \*/ = \{isa = PBXFileReference;[^\n]*?path = (?:"([^"]+)"|([^;]+));',
              text):
              refs[m.group(1)] = (m.group(3) or m.group(4)).strip()

          in_project = set()
          for m in re.finditer(r'/\* (.+?) in Sources \*/ = \{isa = PBXBuildFile; fileRef = (\w{24})', text):
              path = refs.get(m.group(2))
              if path:
                  in_project.add(os.path.basename(path))

          print("compiled by project:", sorted(in_project))

          extra = []
          for f in sorted(glob.glob("RSDKv4/*.cpp")):
              name = os.path.basename(f)
              if name in in_project or name in ("main.cpp", "Text.cpp"):
                  continue
              extra.append(name)

          lines = ["", "// --- appended by CI: files missing from the iOS project ---"]
          for name in extra:
              lines.append('#include "%s"' % name)
          if os.path.exists("dependencies/all/tinyxml2/tinyxml2.cpp"):
              lines.append('#include "../dependencies/all/tinyxml2/tinyxml2.cpp"')
              extra.append("tinyxml2.cpp")

          with open("RSDKv4/Text.cpp", "a") as f:
              f.write("\n".join(lines) + "\n")
          print("appended:", extra)
          EOF

      - name: Build SDL2 for iOS
        run: |
          curl -fL -o sdl.tar.gz https://github.com/libsdl-org/SDL/archive/refs/tags/release-2.32.10.tar.gz
          tar xzf sdl.tar.gz
          SDLDIR=SDL-release-2.32.10
          xcodebuild \
            -project "$SDLDIR/Xcode/SDL/SDL.xcodeproj" \
            -target Framework-iOS \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/sdl-build" \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGNING_ALLOWED=NO \
            build
          cp -R sdl-build/Release-iphoneos/SDL2.framework dependencies/ios/
          ls dependencies/ios/SDL2.framework

          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=13.0 \
            -isysroot "$SDK" -I"$SDLDIR/include" \
            -c "$SDLDIR/src/main/uikit/SDL_uikit_main.c" -o sdlmain.o
          ar rcs dependencies/ios/libSDLMain.a sdlmain.o

      - name: Build libogg and libvorbis for iOS
        run: |
          PREFIX="$PWD/deps-ios"
          COMMON="-DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_INSTALL_PREFIX=$PREFIX"

          curl -fL -o ogg.tar.gz https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.gz
          tar xzf ogg.tar.gz
          cmake -S libogg-1.3.5 -B build-ogg $COMMON -DINSTALL_DOCS=OFF
          cmake --build build-ogg --target install

          curl -fL -o vorbis.tar.xz https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.xz
          tar xJf vorbis.tar.xz
          cmake -S libvorbis-1.3.7 -B build-vorbis $COMMON \
            -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DOGG_INCLUDE_DIR="$PREFIX/include" \
            -DOGG_LIBRARY="$PREFIX/lib/libogg.a"
          cmake --build build-vorbis --target install

          ls -la deps-ios/lib deps-ios/include

      - name: Generate Info.plist
        run: |
          cat > dependencies/ios/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleExecutable</key><string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key><string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>$(PRODUCT_NAME)</string>
            <key>CFBundleDisplayName</key><string>RSDKv4</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$(MARKETING_VERSION)</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>UIFileSharingEnabled</key><true/>
            <key>LSSupportsOpeningDocumentsInPlace</key><true/>
            <key>UIRequiresFullScreen</key><true/>
            <key>UIStatusBarHidden</key><true/>
            <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
          </dict>
          </plist>
          EOF
          plutil -insert UILaunchStoryboardName -string LaunchScreen dependencies/ios/Info.plist
          plutil -lint dependencies/ios/Info.plist

      - name: Create OpenGL ES compatibility headers
        run: |
          mkdir -p gl-shim/GL gl-shim/OpenGL
          cat > gl-shim/gles_compat.h <<'EOF'
          #pragma once
          #include <OpenGLES/ES1/gl.h>
          #include <OpenGLES/ES1/glext.h>
          #define glOrtho glOrthof
          #define glFrustum glFrustumf
          #define glClearDepth glClearDepthf
          #define glGenFramebuffers glGenFramebuffersOES
          #define glBindFramebuffer glBindFramebufferOES
          #define glDeleteFramebuffers glDeleteFramebuffersOES
          #define glFramebufferTexture2D glFramebufferTexture2DOES
          #define glCheckFramebufferStatus glCheckFramebufferStatusOES
          #define glGenFramebuffersEXT glGenFramebuffersOES
          #define glBindFramebufferEXT glBindFramebufferOES
          #define glDeleteFramebuffersEXT glDeleteFramebuffersOES
          #define glFramebufferTexture2DEXT glFramebufferTexture2DOES
          #define glCheckFramebufferStatusEXT glCheckFramebufferStatusOES
          #define GL_FRAMEBUFFER GL_FRAMEBUFFER_OES
          #define GL_FRAMEBUFFER_EXT GL_FRAMEBUFFER_OES
          #define GL_COLOR_ATTACHMENT0 GL_COLOR_ATTACHMENT0_OES
          #define GL_COLOR_ATTACHMENT0_EXT GL_COLOR_ATTACHMENT0_OES
          #define GL_FRAMEBUFFER_COMPLETE GL_FRAMEBUFFER_COMPLETE_OES
          #define GL_FRAMEBUFFER_COMPLETE_EXT GL_FRAMEBUFFER_COMPLETE_OES
          #define GL_FRAMEBUFFER_BINDING GL_FRAMEBUFFER_BINDING_OES
          #define GL_FRAMEBUFFER_BINDING_EXT GL_FRAMEBUFFER_BINDING_OES
          EOF
          cat > gl-shim/GL/glew.h <<'EOF'
          #pragma once
          #include "../gles_compat.h"
          #define GLEW_OK 0
          #define GLEW_ERROR_NO_GLX_DISPLAY 4
          static GLboolean glewExperimental = GL_TRUE;
          static inline int glewInit(void) { return GLEW_OK; }
          static inline const char *glewGetErrorString(int e) { return ""; }
          EOF
          for h in GL/gl.h GL/glext.h OpenGL/gl.h OpenGL/glext.h; do
            echo '#include "../gles_compat.h"' > "gl-shim/$h"
          done
          find gl-shim -type f

      - name: Diagnose GL setup and frame output
        run: |
          echo "=== Drawing.cpp 196-300 (GL init) ==="
          sed -n 196,300p RSDKv4/Drawing.cpp
          echo "=== Drawing.cpp 540-700 (frame output) ==="
          sed -n 540,700p RSDKv4/Drawing.cpp
          echo "=== Renderer.cpp 490-640 (framebuffer / render setup) ==="
          sed -n 490,640p RSDKv4/Renderer.cpp
          echo "=== defaultFramebuffer uses ==="
          grep -n "defaultFramebuffer" RSDKv4/*.cpp RSDKv4/*.hpp

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project "RSDKv4 ios.xcodeproj" \
            -scheme "RSDKv4" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            GCC_PREPROCESSOR_DEFINITIONS='$(inherited) RETRO_USING_OPENGL=1 GLES_SILENCE_DEPRECATION=1' \
            HEADER_SEARCH_PATHS='$(inherited) $(PROJECT_DIR)/gl-shim $(PROJECT_DIR)/RSDKv4 $(PROJECT_DIR)/RSDKv4/NativeObjects $(PROJECT_DIR)/dependencies/mac $(PROJECT_DIR)/deps-ios/include $(PROJECT_DIR)/dependencies/all/asio/asio/include $(PROJECT_DIR)/dependencies/all/tinyxml2 $(PROJECT_DIR)/dependencies/all/stb-image' \
            LIBRARY_SEARCH_PATHS='$(inherited) $(PROJECT_DIR)/deps-ios/lib' \
            OTHER_LDFLAGS='$(inherited) -lvorbisfile -lvorbis -logg -framework OpenGLES' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r RSDKv4-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv4-ios-unsigned
          path: RSDKv4-unsigned.ipa
