name: Build iOS

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Diagnose platform detection
        run: |
          echo "=== dependencies.txt ==="
          cat dependencies/ios/dependencies.txt
          echo "=== RetroEngine.hpp 40-110 ==="
          sed -n 40,110p RSDKv4/RetroEngine.hpp
          echo "=== BASE_PATH definitions ==="
          grep -rn "BASE_PATH" RSDKv4/*.hpp RSDKv4/*.cpp | head -20
          echo "=== project build settings ==="
          sed -n 425,450p "RSDKv4 ios.xcodeproj/project.pbxproj"
          sed -n 510,560p "RSDKv4 ios.xcodeproj/project.pbxproj"

      - name: Remove Data.rsdk from bundle resources
        run: sed -i '' '/Data.rsdk in Resources/d' "RSDKv4 ios.xcodeproj/project.pbxproj"

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project "RSDKv4 ios.xcodeproj" \
            -scheme "RSDKv4" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Enable file sharing in Info.plist
        run: |
          PLIST=$(ls -d build/Build/Products/Release-iphoneos/*.app)/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" "$PLIST"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r RSDKv4-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv4-ios-unsigned
          path: RSDKv4-unsigned.ipa
