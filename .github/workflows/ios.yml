name: Build iOS

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Diagnose iOS build setup
        run: |
          echo "=== dependencies/ios contents ==="
          ls -la dependencies/ios
          echo "=== RetroEngine.hpp 110-230 ==="
          sed -n 110,230p RSDKv4/RetroEngine.hpp
          echo "=== RetroEngine.cpp 285-335 ==="
          sed -n 285,335p RSDKv4/RetroEngine.cpp
          echo "=== project defines and search paths ==="
          grep -n -E "GCC_PREPROCESSOR_DEFINITIONS|RETRO_|HEADER_SEARCH_PATHS|FRAMEWORK_SEARCH_PATHS|SDL|OpenGL" \
            "RSDKv4 ios.xcodeproj/project.pbxproj" | head -60
          echo "=== other platform defines ==="
          grep -rn -E "RETRO_iOS|RETRO_PLATFORM *==|define RETRO_PLATFORM" RSDKv4/*.hpp | head -40

      - name: Remove Data.rsdk from bundle resources
        run: sed -i '' '/Data.rsdk in Resources/d' "RSDKv4 ios.xcodeproj/project.pbxproj"

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project "RSDKv4 ios.xcodeproj" \
            -scheme "RSDKv4" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Enable file sharing in Info.plist
        run: |
          PLIST=$(ls -d build/Build/Products/Release-iphoneos/*.app)/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" "$PLIST"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r RSDKv4-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv4-ios-unsigned
          path: RSDKv4-unsigned.ipa
